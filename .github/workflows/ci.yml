name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # xdvj 依赖经 JitPack 解析（首次构建 xdvj 仓库需要几分钟）
      - name: Build & test
        run: mvn -B --no-transfer-progress verify

      - name: Upload dist jar
        uses: actions/upload-artifact@v4
        with:
          name: xdviofdmx-dist
          path: target/xdviofdmx-0.1.0-dist.jar
          if-no-files-found: error
