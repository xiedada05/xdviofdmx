name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xdvjni

      # 字体子集化路径在 CI 中一并实测
      - name: Install python3-fonttools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-fonttools

      # 从源码构建安装 xdvj（确定性；下游一次性使用也可改走 JitPack，
      # 首次解析需等待 JitPack 现场完成 Rust 构建）
      - uses: actions/checkout@v4
        with:
          repository: xiedada05/xdvjni
          path: xdvjni

      - name: Install xdvj locally
        run: mvn -B --no-transfer-progress install -f xdvjni/pom.xml

      - name: Build & test
        run: mvn -B --no-transfer-progress verify

      - name: Upload dist jar
        uses: actions/upload-artifact@v4
        with:
          name: xdviofdmx-dist
          path: target/xdviofdmx-0.1.0-dist.jar
          if-no-files-found: error
